<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="tempoBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="tintWindow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="shadowGlowT" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="300" cy="282" rx="270" ry="20" fill="url(#shadowGlowT)"/>

  <!-- TEMPO TRAVELLER (14/17 SEATER LUXURY VAN) -->
  <g>
    <!-- Main High-Roof Van Shell -->
    <path d="M 70 230 
             L 70 200 
             L 100 170 
             L 130 90 
             C 134 76, 148 68, 168 68 
             L 510 68 
             C 528 68, 542 78, 546 96 
             L 550 220 
             C 552 236, 546 250, 532 254 
             L 476 254 
             C 472 220, 440 196, 404 196 
             C 368 196, 336 220, 332 254 
             L 214 254 
             C 210 220, 178 196, 142 196 
             C 106 196, 74 220, 70 254 
             L 64 254 
             Z" 
          fill="url(#tempoBody)" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Roof Carrier with Ladder Bracket -->
    <rect x="180" y="52" width="310" height="16" rx="4" fill="#334155"/>
    <line x1="220" y1="52" x2="220" y2="68" stroke="#64748B" stroke-width="2"/>
    <line x1="280" y1="52" x2="280" y2="68" stroke="#64748B" stroke-width="2"/>
    <line x1="340" y1="52" x2="340" y2="68" stroke="#64748B" stroke-width="2"/>
    <line x1="400" y1="52" x2="400" y2="68" stroke="#64748B" stroke-width="2"/>
    <line x1="460" y1="52" x2="460" y2="68" stroke="#64748B" stroke-width="2"/>

    <!-- Dynamic Brand Graphics Strip on Tempo Traveller -->
    <path d="M 68 206 L 548 206 L 546 218 L 68 218 Z" fill="#333333"/>
    <path d="M 68 218 L 546 218 L 546 224 L 68 224 Z" fill="#FFEC03"/>

    <!-- Grille and High Beam Lamps -->
    <rect x="70" y="210" width="34" height="28" rx="2" fill="#1E293B"/>
    <line x1="72" y1="216" x2="102" y2="216" stroke="#FFEC03" stroke-width="2"/>
    <line x1="72" y1="224" x2="102" y2="224" stroke="#FFEC03" stroke-width="2"/>
    <polygon points="102,188 132,176 128,194 100,204" fill="#E0F2FE" stroke="#38BDF8"/>

    <!-- Panoramic Passenger Windows (4 Large Bays) -->
    <!-- Driver Window -->
    <path d="M 134 168 L 158 92 C 162 82, 172 78, 184 78 L 218 78 L 216 168 Z" fill="url(#tintWindow)"/>
    <!-- Passenger Bay 1 -->
    <rect x="224" y="78" width="68" height="90" rx="3" fill="url(#tintWindow)"/>
    <!-- Passenger Bay 2 -->
    <rect x="298" y="78" width="68" height="90" rx="3" fill="url(#tintWindow)"/>
    <!-- Passenger Bay 3 -->
    <rect x="372" y="78" width="68" height="90" rx="3" fill="url(#tintWindow)"/>
    <!-- Rear Bay -->
    <path d="M 446 78 L 512 78 C 522 78, 532 84, 536 94 L 538 168 L 444 168 Z" fill="url(#tintWindow)"/>

    <!-- Window Reflections -->
    <line x1="230" y1="84" x2="520" y2="84" stroke="#FFFFFF" stroke-width="1.5" opacity="0.4"/>
    <line x1="160" y1="164" x2="534" y2="164" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Large Wheels -->
    <g transform="translate(142, 254)">
      <circle cx="0" cy="0" r="46" fill="#1E293B"/>
      <circle cx="0" cy="0" r="40" fill="#0F172A"/>
      <circle cx="0" cy="0" r="26" fill="#94A3B8"/>
      <circle cx="0" cy="0" r="10" fill="#333333"/>
      <circle cx="0" cy="0" r="5" fill="#FFEC03"/>
    </g>
    <g transform="translate(404, 254)">
      <circle cx="0" cy="0" r="46" fill="#1E293B"/>
      <circle cx="0" cy="0" r="40" fill="#0F172A"/>
      <circle cx="0" cy="0" r="26" fill="#94A3B8"/>
      <circle cx="0" cy="0" r="10" fill="#333333"/>
      <circle cx="0" cy="0" r="5" fill="#FFEC03"/>
    </g>

    <!-- Permit Badge -->
    <g transform="translate(254, 180)">
      <rect x="0" y="0" width="130" height="20" rx="4" fill="#333333" stroke="#FFEC03" stroke-width="1.2"/>
      <rect x="3" y="3" width="6" height="14" rx="1.5" fill="#FFEC03"/>
      <text x="14" y="14" font-family="'Poppins', sans-serif" font-weight="800" font-size="8.5" fill="#FFEC03">ALL INDIA TOURIST PERMIT</text>
    </g>
  </g>
</svg>
