<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="sedanBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="sedanGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="shadowGlowS" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="300" cy="274" rx="250" ry="18" fill="url(#shadowGlowS)"/>

  <!-- COMPACT SEDAN (SWIFT DZIRE / ETIOS) -->
  <g>
    <!-- Aerodynamic Sedan Silhouette -->
    <path d="M 64 228 
             C 64 220, 72 208, 92 200 
             L 156 182 
             L 204 136 
             C 216 124, 236 118, 260 118 
             L 396 118 
             C 420 118, 440 128, 458 144 
             L 484 182 
             L 532 192 
             C 546 196, 554 208, 552 224 
             L 546 244 
             L 476 244 
             C 474 218, 448 196, 418 196 
             C 388 196, 362 218, 360 244 
             L 214 244 
             C 212 218, 186 196, 156 196 
             C 126 196, 100 218, 98 244 
             L 70 244 
             Z" 
          fill="url(#sedanBody)" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Headlamp & Grille -->
    <path d="M 64 224 L 98 214 L 96 238 L 68 240 Z" fill="#334155"/>
    <line x1="68" y1="228" x2="96" y2="220" stroke="#FFEC03" stroke-width="2"/>
    <polygon points="96,212 144,194 140,208 94,222" fill="#E0F2FE" stroke="#38BDF8"/>

    <!-- Windows -->
    <path d="M 166 180 L 210 138 C 220 128, 234 122, 252 122 L 296 122 L 294 180 Z" fill="url(#sedanGlass)"/>
    <path d="M 302 122 L 390 122 C 406 122, 420 128, 432 140 L 466 180 L 300 180 Z" fill="url(#sedanGlass)"/>

    <!-- Chrome waistline -->
    <line x1="160" y1="182" x2="474" y2="182" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Tail Lamp -->
    <polygon points="496,188 534,196 528,218 492,216" fill="#EF4444"/>

    <!-- Wheels -->
    <g transform="translate(156, 244)">
      <circle cx="0" cy="0" r="40" fill="#1E293B"/>
      <circle cx="0" cy="0" r="35" fill="#0F172A"/>
      <circle cx="0" cy="0" r="24" fill="#94A3B8"/>
      <circle cx="0" cy="0" r="8" fill="#333333"/>
      <circle cx="0" cy="0" r="4" fill="#FFEC03"/>
    </g>
    <g transform="translate(418, 244)">
      <circle cx="0" cy="0" r="40" fill="#1E293B"/>
      <circle cx="0" cy="0" r="35" fill="#0F172A"/>
      <circle cx="0" cy="0" r="24" fill="#94A3B8"/>
      <circle cx="0" cy="0" r="8" fill="#333333"/>
      <circle cx="0" cy="0" r="4" fill="#FFEC03"/>
    </g>

    <!-- Permit Badge -->
    <g transform="translate(290, 192)">
      <rect x="0" y="0" width="80" height="15" rx="3" fill="#333333" stroke="#FFEC03" stroke-width="1"/>
      <text x="8" y="11" font-family="'Poppins', sans-serif" font-weight="700" font-size="7" fill="#FFEC03">ALL INDIA PERMIT</text>
    </g>
  </g>
</svg>
