<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="coachBody" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="busGlass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="shadowGlowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.35"/>
      <stop offset="80%" stop-color="#1E293B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <ellipse cx="300" cy="286" rx="280" ry="20" fill="url(#shadowGlowB)"/>

  <!-- TOURIST COACH / MINI BUS (25-32 SEATER) -->
  <g>
    <!-- Bus Body Shell -->
    <path d="M 50 240 
             L 50 140 
             C 52 100, 68 64, 110 64 
             L 540 64 
             C 552 64, 560 74, 560 88 
             L 560 236 
             C 560 250, 550 260, 536 260 
             L 480 260 
             C 476 220, 440 192, 400 192 
             C 360 192, 324 220, 320 260 
             L 210 260 
             C 206 220, 170 192, 130 192 
             C 90 192, 54 220, 50 260 
             Z" 
          fill="url(#coachBody)" stroke="#94A3B8" stroke-width="1.5"/>

    <!-- Large Front Panoramic Windshield -->
    <path d="M 54 130 L 76 74 C 84 68, 96 66, 112 66 L 154 66 L 152 154 L 54 154 Z" fill="url(#busGlass)"/>

    <!-- Continuous Side Glass Bays -->
    <rect x="160" y="74" width="70" height="80" rx="4" fill="url(#busGlass)"/>
    <rect x="236" y="74" width="70" height="80" rx="4" fill="url(#busGlass)"/>
    <rect x="312" y="74" width="70" height="80" rx="4" fill="url(#busGlass)"/>
    <rect x="388" y="74" width="70" height="80" rx="4" fill="url(#busGlass)"/>
    <rect x="464" y="74" width="84" height="80" rx="4" fill="url(#busGlass)"/>

    <!-- Dynamic BS Travels Yellow & Charcoal Swish -->
    <path d="M 50 190 L 560 190 L 560 206 L 50 206 Z" fill="#333333"/>
    <path d="M 50 206 L 560 206 L 560 216 L 50 216 Z" fill="#FFEC03"/>

    <!-- Wheels -->
    <g transform="translate(130, 260)">
      <circle cx="0" cy="0" r="48" fill="#1E293B"/>
      <circle cx="0" cy="0" r="42" fill="#0F172A"/>
      <circle cx="0" cy="0" r="28" fill="#94A3B8"/>
      <circle cx="0" cy="0" r="10" fill="#333333"/>
      <circle cx="0" cy="0" r="5" fill="#FFEC03"/>
    </g>
    <g transform="translate(400, 260)">
      <circle cx="0" cy="0" r="48" fill="#1E293B"/>
      <circle cx="0" cy="0" r="42" fill="#0F172A"/>
      <circle cx="0" cy="0" r="28" fill="#94A3B8"/>
      <circle cx="0" cy="0" r="10" fill="#333333"/>
      <circle cx="0" cy="0" r="5" fill="#FFEC03"/>
    </g>

    <!-- Permit Badge -->
    <g transform="translate(230, 168)">
      <rect x="0" y="0" width="140" height="18" rx="3" fill="#333333" stroke="#FFEC03" stroke-width="1.2"/>
      <text x="8" y="13" font-family="'Poppins', sans-serif" font-weight="800" font-size="8.5" fill="#FFEC03">ALL INDIA TOURIST PERMIT</text>
    </g>
  </g>
</svg>
