<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="100%" height="100%">
  <defs>
    <linearGradient id="tkvLogoGoldDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="tkvDropShadowDark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Icon Emblem -->
  <g transform="translate(6, 8)" filter="url(#tkvDropShadowDark)">
    <!-- Base Rounded Diamond / Shield -->
    <rect x="2" y="2" width="60" height="60" rx="16" fill="#1E40AF" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    
    <!-- Yellow Taxi Roof Light -->
    <rect x="23" y="10" width="18" height="4.5" rx="2" fill="#FACC15"/>
    
    <!-- Stylized Taxi Frame -->
    <path d="M 14 34 L 18 22 C 19.5 18, 22 16.5, 27 16.5 L 37 16.5 C 42 16.5, 44.5 18, 46 22 L 50 34" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Wheels -->
    <circle cx="20" cy="40" r="4.5" fill="#FFFFFF"/>
    <circle cx="20" cy="40" r="2" fill="#1E40AF"/>
    <circle cx="44" cy="40" r="4.5" fill="#FFFFFF"/>
    <circle cx="44" cy="40" r="2" fill="#1E40AF"/>
    
    <!-- Gold Bumper Bar -->
    <path d="M 12 34 L 52 34" stroke="#FACC15" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Highway Road Stripes in emblem -->
    <line x1="32" y1="46" x2="32" y2="54" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2,2"/>
  </g>
  
  <!-- Brand Typography -->
  <g transform="translate(78, 10)">
    <!-- "TKV" in Crisp White -->
    <text x="0" y="34" font-family="'Poppins', system-ui, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="-0.5">TKV</text>
    
    <!-- "DROP TAXI" in Gold -->
    <text x="74" y="34" font-family="'Poppins', system-ui, sans-serif" font-weight="800" font-size="29" fill="url(#tkvLogoGoldDark)" letter-spacing="0.5">DROP TAXI</text>
    
    <!-- Location & USP Pill -->
    <g transform="translate(0, 42)">
      <rect x="0" y="0" width="248" height="18" rx="4" fill="rgba(30, 64, 175, 0.4)" stroke="rgba(147, 197, 253, 0.4)" stroke-width="1"/>
      <rect x="2" y="2" width="6" height="14" rx="2" fill="#FACC15"/>
      <text x="14" y="13" font-family="'Poppins', system-ui, sans-serif" font-weight="700" font-size="8.5" fill="#93C5FD" letter-spacing="0.8">#1 ONE WAY &amp; OUTSTATION CABS</text>
      <circle cx="198" cy="9" r="2" fill="#FACC15"/>
      <text x="206" y="13" font-family="'Poppins', system-ui, sans-serif" font-weight="700" font-size="8.5" fill="#FCD34D" letter-spacing="0.5">HOSUR</text>
    </g>
  </g>
</svg>
